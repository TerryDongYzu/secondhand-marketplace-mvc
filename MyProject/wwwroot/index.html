<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>二手物品交易平台-首頁</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* 系統入口卡片設計 */
        .welcome-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            padding: 3rem 5rem;
            text-align: center;
            transition: transform 0.3s ease;
        }

            /* 滑鼠移過去卡片會微微上浮 */
            .welcome-card:hover {
                transform: translateY(-5px);
            }

        /* 學生資訊的排版 */
        .student-info {
            color: #6c757d;
            font-size: 1.15rem;
            margin-bottom: 2.5rem;
            border-top: 1px solid #eee;
            border-bottom: 1px solid #eee;
            padding: 1rem 0;
        }

        /* 按鈕美化 */
        .enter-btn {
            font-size: 1.25rem;
            padding: 0.75rem 3rem;
            border-radius: 50px;
            box-shadow: 0 4px 15px rgba(25, 135, 84, 0.3);
            transition: all 0.2s ease;
        }

            .enter-btn:hover {
                box-shadow: 0 6px 20px rgba(25, 135, 84, 0.4);
                transform: scale(1.05);
            }
    </style>
</head>
<body>
    <div class="welcome-card">
        <div class="mb-4">
            <div class="text-center mb-4">
                <img src="images/yzulogo.jpg" alt="系統 Logo" style="width: 120px; height: auto;" />
            </div>
        </div>
        <h1 class="fw-bold mb-4 text-dark">二手物品交易平台</h1>
        <div class="student-info d-flex justify-content-center">
            <table class="table-borderless" style="margin: 0 auto; width: auto;">
                <tr>
                    <td class="text-end fw-bold text-secondary pe-2 pb-1">小組：</td>
                    <td class="text-start text-dark pb-1">第11組</td>
                </tr>
                <tr>
                    <td class="text-end fw-bold text-secondary pe-2">組員：</td>
                    <td class="text-start text-dark">董承庭、彭柏燁、孫立維、王煒翔</td>
                </tr>
            </table>
        </div>
        <a href="./Account/Login" class="btn btn-success btn-lg enter-btn fw-bold text-white text-decoration-none">
            進入二手物品交易平台
        </a>
    </div>
</body>
</html>
